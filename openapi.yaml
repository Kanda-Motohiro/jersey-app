openapi: 3.0.3
info:
  title: Hello API
  version: 1.0.0
paths:
  /hello:
    get:
      tags:
        - Hello
      summary: Returns a greeting message
      operationId: hello
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            default: "Jetty + Jersey"
      security:
        - basicAuth: []
      responses:
        '200':
          description: A successful response returning plain text greeting
          content:
            text/plain:
              schema:
                type: string
  /world:
    get:
      tags:
        - Hello
      summary: Returns world message
      operationId: world
      responses:
        '200':
          description: A successful response returning plain text "World"
          content:
            text/plain:
              schema:
                type: string
  /concat:
    post:
      tags:
        - Hello
      summary: Concatenates list of strings
      operationId: concat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: A successful response returning JSON with the concatenated string
          content:
            application/json:
              schema:
                type: object
                properties:
                  out:
                    type: string
                required:
                  - out
  /books:
    get:
      tags:
        - Books
      summary: Returns all books
      operationId: listBooks
      responses:
        '200':
          description: A successful response returning all books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
    post:
      tags:
        - Books
      summary: Adds a book to the database
      operationId: addBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Book'
      responses:
        '200':
          description: A successful response returning the created book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        author:
          type: string
      required:
        - title
        - author
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
