openapi: 3.0.3
info:
  title: Hello API
  version: 1.0.0
paths:
  /hello:
    get:
      tags:
        - Hello
      summary: Returns a greeting message
      operationId: hello
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            default: "Jetty + Jersey"
      security:
        - basicAuth: []
      responses:
        '200':
          description: A successful response returning plain text greeting
          content:
            text/plain:
              schema:
                type: string
  /world:
    get:
      tags:
        - Hello
      summary: Returns world message
      operationId: world
      responses:
        '200':
          description: A successful response returning plain text "World"
          content:
            text/plain:
              schema:
                type: string
  /concat:
    post:
      tags:
        - Hello
      summary: Concatenates list of strings
      operationId: concat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: A successful response returning JSON with the concatenated string
          content:
            application/json:
              schema:
                type: object
                properties:
                  out:
                    type: string
                required:
                  - out
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
